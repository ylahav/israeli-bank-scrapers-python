name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest -v

      # Deliberately NOT running anything against real bank sites here —
      # CI only covers what tests/ actually exercises: pure-logic unit tests
      # and the browser smoke test against a local HTML fixture. Live-site
      # verification (see README's Verification status table) is manual and
      # requires real credentials, which never belong in CI.
